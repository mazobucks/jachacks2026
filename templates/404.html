{% extends "base.html" %}

{% block title %} 404 - Page Not Found {% endblock %}

{% block content %}
  <style>
    .error-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 60vh;
      text-align: center;
      gap: 2rem;
    }
    .error-code {
      font-size: 6rem;
      font-weight: 900;
      color: #3b82f6;
      line-height: 1;
    }
    .error-title {
      font-size: 2rem;
      font-weight: 700;
      color: #0f172a;
    }
    .error-message {
      font-size: 1.1rem;
      color: #64748b;
      max-width: 500px;
    }
    .error-actions {
      display: flex;
      gap: 1rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .btn {
      padding: 0.75rem 1.5rem;
      border-radius: 6px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      border: none;
      cursor: pointer;
      font-size: 1rem;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:hover {
      background: #2563eb;
      transform: translateY(-2px);
    }
    .btn-secondary {
      background: #e2e8f0;
      color: #0f172a;
    }
    .btn-secondary:hover {
      background: #cbd5e1;
      transform: translateY(-2px);
    }
  </style>

  <div class="error-container">
    <div class="error-code">404</div>
    <div class="error-title">Page Not Found</div>
    <p class="error-message">
      Sorry, the page you're looking for doesn't exist or may have been moved.
    </p>
    <div class="error-actions">
      <a href="{{ url_for('home') }}" class="btn btn-primary">Home</a>
      <a href="{{ url_for('goals') }}" class="btn btn-secondary">View Goals</a>
    </div>
  </div>
{% endblock %}
