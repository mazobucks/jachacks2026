{% extends "base.html" %}

{% block title %}Leaderboard — JaHacks 2026{% endblock %}

{% block content %}
<style>
    @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap');

    :root {
        --gold: #f5c542;
        --silver: #b0bec5;
        --bronze: #cd7f32;
        --accent: #3b82f6;
    }

    .lb-wrapper {
        max-width: 760px;
        margin: 0 auto;
        padding: 2rem 0 4rem;
    }

    /* Header */
    .lb-header {
        text-align: center;
        margin-bottom: 2.5rem;
    }

    .lb-label {
        font-size: 11px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--accent);
        font-family: 'DM Mono', monospace;
        margin-bottom: 6px;
    }

    .lb-title {
        font-family: 'Bebas Neue', sans-serif;
        font-size: clamp(52px, 10vw, 88px);
        line-height: 1;
        letter-spacing: 0.04em;
        color: #0f172a;
    }

    .lb-title span {
        color: var(--accent);
    }

    /* Podium */
    .podium {
        display: flex;
        align-items: flex-end;
        justify-content: center;
        gap: 12px;
        margin-bottom: 2.5rem;
        height: 190px;
    }

    .podium-slot {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
    }

    .podium-name {
        font-size: 11px;
        letter-spacing: 0.06em;
        color: #475569;
        font-family: 'DM Mono', monospace;
        max-width: 90px;
        text-align: center;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
    }

    .podium-pts {
        font-size: 12px;
        font-family: 'DM Mono', monospace;
        color: #334155;
        font-weight: 500;
    }

    .podium-block {
        width: 90px;
        border-radius: 8px 8px 0 0;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: 'Bebas Neue', sans-serif;
        font-size: 30px;
    }

    .podium-slot:nth-child(1) .podium-block {
        height: 95px;
        background: linear-gradient(160deg, #e8ecf0, #d0d8e0);
        border: 2px solid var(--silver);
        color: var(--silver);
        box-shadow: 0 4px 16px rgba(176, 190, 197, 0.3);
    }

    .podium-slot:nth-child(2) .podium-block {
        height: 140px;
        background: linear-gradient(160deg, #fef9e7, #fde68a);
        border: 2px solid var(--gold);
        color: #b8860b;
        box-shadow: 0 6px 24px rgba(245, 197, 66, 0.3);
    }

    .podium-slot:nth-child(3) .podium-block {
        height: 70px;
        background: linear-gradient(160deg, #f5e6d3, #e8c9a0);
        border: 2px solid var(--bronze);
        color: var(--bronze);
        box-shadow: 0 4px 16px rgba(205, 127, 50, 0.25);
    }

    /* Board */
    .board {
        background: white;
        border-radius: 10px;
        box-shadow: 0 6px 18px rgba(15, 23, 42, 0.07);
        overflow: hidden;
    }

    .board-header {
        display: grid;
        grid-template-columns: 56px 1fr 160px 110px;
        padding: 12px 20px;
        background: #f8fafc;
        border-bottom: 1px solid #e2e8f0;
        font-size: 10px;
        letter-spacing: 0.2em;
        text-transform: uppercase;
        color: #94a3b8;
        font-family: 'DM Mono', monospace;
    }

    .board-header span:last-child {
        text-align: right;
    }

    .lb-row {
        display: grid;
        grid-template-columns: 56px 1fr 160px 110px;
        padding: 14px 20px;
        border-bottom: 1px solid #f1f5f9;
        align-items: center;
        transition: background 0.15s;
        animation: fadeUp 0.4s ease both;
    }

    .lb-row:last-child {
        border-bottom: none;
    }

    .lb-row:hover {
        background: #f8fafc;
    }

    .lb-rank {
        font-family: 'Bebas Neue', sans-serif;
        font-size: 24px;
        color: #cbd5e1;
    }

    .lb-row.rank-1 .lb-rank {
        color: var(--gold);
    }

    .lb-row.rank-2 .lb-rank {
        color: var(--silver);
    }

    .lb-row.rank-3 .lb-rank {
        color: var(--bronze);
    }

    .lb-name {
        font-weight: 700;
        color: #0f172a;
        font-size: 14px;
    }

    .lb-program {
        font-size: 12px;
        color: #94a3b8;
        font-family: 'DM Mono', monospace;
    }

    .lb-pts {
        text-align: right;
        font-family: 'DM Mono', monospace;
        font-size: 14px;
        font-weight: 500;
        color: var(--accent);
    }

    .lb-row.rank-1 .lb-pts {
        color: #b8860b;
    }

    .pts-bar {
        height: 3px;
        border-radius: 2px;
        background: linear-gradient(90deg, #06b6d4, #3b82f6);
        margin-top: 4px;
        margin-left: auto;
        opacity: 0.35;
    }

    .lb-row.rank-1 .pts-bar {
        background: var(--gold);
    }

    /* States */
    .state-msg {
        text-align: center;
        padding: 48px 20px;
        color: #94a3b8;
        font-family: 'DM Mono', monospace;
        font-size: 13px;
    }

    .spinner {
        width: 22px;
        height: 22px;
        border: 2px solid #e2e8f0;
        border-top-color: var(--accent);
        border-radius: 50%;
        animation: spin 0.7s linear infinite;
        margin: 0 auto 12px;
    }

    @keyframes fadeUp {
        from {
            opacity: 0;
            transform: translateY(12px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }

    @media (max-width: 520px) {

        .board-header,
        .lb-row {
            grid-template-columns: 48px 1fr 100px;
        }

        .board-header span:nth-child(3),
        .lb-program {
            display: none;
        }
    }
</style>

<div class="lb-wrapper">
    <div class="lb-header">
        <p class="lb-label">Season Rankings</p>
        <h1 class="lb-title">LEADER<span>BOARD</span></h1>
    </div>

    <div class="podium" id="podium"></div>

    <div class="board">
        <div class="board-header">
            <span>#</span>
            <span>Player</span>
            <span>Program</span>
            <span style="text-align:right">Points</span>
        </div>
        <div id="board-body">
            <div class="state-msg">
                <div class="spinner"></div>
                Loading rankings…
            </div>
        </div>
    </div>
</div>

<script>
    function esc(str) {
        return String(str)
            .replace(/&/g, '&amp;').replace(/</g, '&lt;')
            .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    async function loadLeaderboard() {
        const body = document.getElementById('board-body');
        const podium = document.getElementById('podium');

        try {
            const res = await fetch('/api/leaderboard');
            if (!res.ok) throw new Error(`HTTP ${res.status}`);
            const data = await res.json();

            if (!data.length) {
                body.innerHTML = '<div class="state-msg">No players yet.</div>';
                return;
            }

            const maxPts = data[0].total_points || 1;

            // Podium — reordered: 2nd, 1st, 3rd
            const top3 = [data[1], data[0], data[2]].filter(Boolean);
            const medals = ['2', '1', '3'];
            podium.innerHTML = top3.map((p, i) => `
        <div class="podium-slot">
          <div class="podium-name">${esc(p.name)}</div>
          <div class="podium-pts">${p.total_points} pts</div>
          <div class="podium-block">${medals[i]}</div>
        </div>
      `).join('');

            // Rows
            body.innerHTML = data.map((p, i) => {
                const rank = i + 1;
                const barWidth = Math.round((p.total_points / maxPts) * 80);
                return `
          <div class="lb-row rank-${rank}" style="animation-delay:${i * 0.05}s">
            <div class="lb-rank">${rank}</div>
            <div class="lb-name">${esc(p.name)}</div>
            <div class="lb-program">${esc(p.program || '—')}</div>
            <div class="lb-pts">
              ${p.total_points}
              <div class="pts-bar" style="width:${barWidth}px"></div>
            </div>
          </div>`;
            }).join('');

        } catch (err) {
            body.innerHTML = `<div class="state-msg">Failed to load: ${esc(err.message)}</div>`;
        }
    }

    loadLeaderboard();
</script>
{% endblock %}
